[project]
name = "me4-hub-clone"
version = "1.0.0"
description = "MCP-Server: Kommunikations-Hub zwischen Hermes CIO, Clones und PI-Agenten"
authors = [{name = "ME4 Team"}]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
]

[project.scripts]
me4-hub = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
